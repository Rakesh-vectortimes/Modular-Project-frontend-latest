<div
  class="published-page"
  [style.backgroundColor]="pageBackgroundColor()"
  [style.backgroundImage]="pageBackgroundImage()"
>
  @if (loading()) {
    <p class="status">Loading app…</p>
  } @else if (error()) {
    <div class="status error" role="alert">
      <h1>App unavailable</h1>
      <p>{{ error() }}</p>
    </div>
  } @else if (layout()) {
    <main class="app-surface">
      <app-layout-tree
        [nodes]="nodes()"
        [interactive]="true"
        [settings]="layout()?.settings ?? null"
      />
    </main>
  }
</div>
