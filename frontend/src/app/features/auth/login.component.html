<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">AB</div>
      <h1>App Builder</h1>
      <p>Sign in to your organization</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" placeholder="you@company.com" autocomplete="email" />
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" formControlName="password" placeholder="••••••••" autocomplete="current-password" />
      </label>

      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="submit-btn" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
